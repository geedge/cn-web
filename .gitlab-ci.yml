#job的名称,自定义
build_image:
  #上面定义的stages
  stage: build_image
  #执行的脚本内容
  script:
    - env | sort
    - pwd
    - export FILE_NAME=$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA.tar.gz
    - chmod +x ./ci-scripts/replaceI18nsql.sh
    - ./ci-scripts/replaceI18nsql.sh
    - mvn clean install -Dxjar.password=$XJAR_PIN -Dxjar.excludes=/db/*,/static/**/*,/install/* -Dmaven.test.skip=true
    - cd ./cn-admin/target
    - go build xjar.go
    - chmod +x xjar
    - echo '提交的分支是'
    - echo $CI_COMMIT_REF_NAME
    - echo 'XJAR_PIN :' $XJAR_PIN
    - echo 'CNWEB_TAG:' $CNWEB_TAG
    - echo 'exec build_image'
    - cd ../ && mvn package -Dxjar.password=$XJAR_PIN -Dmaven.test.skip=true docker:build -DpushImage -DdockerImageTags=$CNWEB_TAG -DdockerImageName=192.168.40.153:9080/cyber-narrator/cn-web-$CI_COMMIT_REF_NAME:$CNWEB_TAG
  #when用于当前一阶段任务故障或者忽略故障的job任务，主要用于清理发生故障时的后续措施。
  #可选项
  #on_success - 默认参数，前一阶段任务成功时才执行
  #on_failure - 前一阶段任务故障时才执行
  #always - 无论前一阶段任务是否成功都执行
  #manual - 手动设置，比较复杂，略过。
  when: on_success
  only:
    - dev-24.01
  tags:
    - galaxy

build_release_image:
  stage: build_image
  script:
    - env | sort
    - pwd
    - export FILE_NAME=$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA.tar.gz
    - chmod +x ./ci-scripts/replaceI18nsql.sh
    - ./ci-scripts/replaceI18nsql.sh
    - mvn clean install -Dxjar.password=$XJAR_PIN -Dxjar.excludes=/db/*,/static/**/*,/install/* -Dmaven.test.skip=true
    - cd ./cn-admin/target
    - go build xjar.go
    - chmod +x xjar
    - echo 'tag名称是'
    - echo $CI_COMMIT_TAG
    - echo '提交的版本是'
    - echo $CI_COMMIT_REF_NAME
    - echo 'exec build_image'
    - cd ../ && mvn package -Dxjar.password=$XJAR_PIN -Dmaven.test.skip=true docker:build -DpushImage -DdockerImageTags=$CNWEB_TAG -DdockerImageName=192.168.40.153:9080/cyber-narrator/cn-web:$CI_COMMIT_TAG
  only:
    - tags
  tags:
    - galaxy

package_clean:
  stage: package_clean
  script:
    - echo '提交的版本是'
    - echo $CI_COMMIT_REF_NAME
    - echo 'last job exec fail, exec mvn clean'
    - mvn clean
  when: on_failure
  only:
    - dev-24.01
  tags:
    - galaxy
