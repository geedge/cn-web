#stages定义pipeline的全部阶段(stage),阶段内所有任务并行执行,123456
#全部执行成功开始下一阶段任务,任何阶段内任意job执行失败都会导致pipeline失败,
#所有stage，job执行成功后pipeline会显示pass。如果未定义stages,则默认有build、
#install,install_clean和build_imag三个阶段,如果未定义stage，则默认test阶段

#这里定义三个阶段（stages），install,install_clean和build_image,stages中的阶段按写的顺序进行，先执行install,然后执行install_clean,然后在执行build_image
variables:
  XJAR_PIN: 111111
  # sys_i18n 数据源信息
  CN_DB_HOST: "192.168.44.53"
  CN_DB_USER: "root"
  CN_DB_PASSWORD: "111111"
  CN_DB_NAME: "cn_api"

stages:
  - gen_git-log
  - update_i18n
  - build_image
#  - test
  - package_clean

before_script:
  - export CNWEB_TAG=$(date +%Y%m%d%H%M%S)

generate_git-log:
  stage: gen_git-log
  script:
    - "git log -100 --pretty=format:'%ad : %s' >> ./cn-admin/src/main/resources/git.log"
  artifacts:
    paths:
      - ./cn-admin/src/main/resources/git.log
  only:
    - dev-24.01
  tags:
    - galaxy

# ci 更新 sys_i18n sql
ci_update_i18n_sql:
  stage: update_i18n
  script:
    - env | sort
    - pwd
    - chmod +x ./ci-scripts/replaceI18nsql.sh
    - ./ci-scripts/replaceI18nsql.sh
  artifacts:
    name: "R__AZ_sys_i18n.sql"
    when: on_success
    paths:
      - ./cn-admin/src/main/resources/db/R__AZ_sys_i18n.sql
    expire_in: 1 day
  # 在哪个分支上可用
  only:
    - dev-24.01
  # 指定哪个ci runner跑该工作
  tags:
    - galaxy

